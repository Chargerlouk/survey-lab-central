<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Survey Lab Central</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="mark" aria-hidden="true">SL</span>
        <span><strong>Survey Lab</strong><small>Central</small></span>
      </div>
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-tab="overview">Overview</button>
        <button type="button" data-tab="clients">Clients</button>
        <button type="button" data-tab="licences">Licences</button>
        <button type="button" data-tab="calculator">Calculator</button>
        <button type="button" data-tab="prices">Prices</button>
      </nav>
      <p class="side-note" id="files"></p>
    </aside>
    <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
